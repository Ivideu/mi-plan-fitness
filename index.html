<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan 4 Semanas - Definición Superior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; margin-bottom: 1.5rem; }
        input[type="checkbox"]:checked + label { text-decoration: line-through; color: #64748b; }
        .week-btn.active { background-color: #22c55e; color: white; }
    </style>
</head>
<body class="p-4 bg-slate-900">
    <div class="max-w-3xl mx-auto">
        <header class="text-center py-6">
            <h1 class="text-3xl font-bold text-green-400">PLAN DE DEFINICIÓN 4 SEMANAS</h1>
            <p class="text-slate-400">44 años | 90kg | Pectoral, Espalda y Bíceps</p>
        </header>

        <!-- Selector de Semanas -->
        <div class="flex gap-2 mb-8 bg-slate-800 p-1 rounded-xl shadow-lg">
            <button onclick="showWeek('S1')" id="btn-S1" class="week-btn active flex-1 py-3 rounded-lg font-bold">Semana 1</button>
            <button onclick="showWeek('S2')" id="btn-S2" class="week-btn flex-1 py-3 rounded-lg font-bold">Semana 2</button>
            <button onclick="showWeek('S3')" id="btn-S3" class="week-btn flex-1 py-3 rounded-lg font-bold">Semana 3</button>
            <button onclick="showWeek('S4')" id="btn-S4" class="week-btn flex-1 py-3 rounded-lg font-bold">Semana 4</button>
        </div>

        <!-- Contenedor dinámico de Semanas -->
        <div id="content">
            <!-- El contenido se genera por JavaScript para asegurar la progresión -->
        </div>

        <!-- Lista de Compra Fija Mercadona -->
        <div class="p-5 bg-green-900/20 border border-green-500/30 rounded-xl mt-10">
            <h3 class="text-xl font-bold text-green-400 mb-2">🛒 Lista de la Compra Mercadona</h3>
            <div class="grid grid-cols-2 gap-2 text-sm text-slate-300">
                <p>• Café natural y Leche +Proteína</p>
                <p>• Pan Centeno 100% y Avena</p>
                <p>• Pollo, Pavo y Ternera magra</p>
                <p>• Salmón, Merluza y Atún natural</p>
                <p>• Brócoli, Canónigos y Aguacate</p>
                <p>• Arroz integral y Quinoa</p>
            </div>
        </div>
    </div>

    <script>
        const planData = {
            S1: { desc: "Adaptación y Técnica", reps: "12-15", card: "15 min HIIT suave" },
            S2: { desc: "Incremento de Carga (+5%)", reps: "10-12", card: "15 min HIIT moderado" },
            S3: { desc: "Definición Máxima (Menos descanso)", reps: "8-10", card: "20 min HIIT" },
            S4: { desc: "Pico de Intensidad", reps: "6-8 (Pesado)", card: "20 min HIIT intenso" }
        };

        function showWeek(weekId) {
            // Actualizar botones
            document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + weekId).classList.add('active');

            const week = planData[weekId];
            const html = `
                <div class="animate-fadeIn">
                    <h2 class="text-2xl font-bold text-blue-400 mb-4">${weekId}: ${week.desc}</h2>
                    <div class="card p-5">
                        <h3 class="font-bold text-yellow-400 mb-3">🏋️ Lunes a Viernes (06:00 - 07:00)</h3>
                        <ul class="space-y-3">
                            <li class="flex items-center gap-3"><input type="checkbox" id="e1" class="w-5 h-5"><label for="e1">Pecho: Press + Aperturas (${week.reps} reps)</label></li>
                            <li class="flex items-center gap-3"><input type="checkbox" id="e2" class="w-5 h-5"><label for="e2">Espalda: Jalón + Remo (${week.reps} reps)[cite: 4]</label></li>
                            <li class="flex items-center gap-3"><input type="checkbox" id="e3" class="w-5 h-5"><label for="e3">Bíceps: Curl Barra + Martillo (3x12)[cite: 4]</label></li>
                            <li class="flex items-center gap-3"><input type="checkbox" id="e4" class="w-5 h-5"><label for="e4">Vientre: Plancha Isométrica (4x45s)[cite: 4]</label></li>
                            <li class="flex items-center gap-3 text-red-300"><input type="checkbox" id="e5" class="w-5 h-5"><label for="e5">Rodillas: Extensión en máquina (Carga ligera)[cite: 4]</label></li>
                            <li class="flex items-center gap-3 border-t border-slate-700 pt-2 text-green-400"><input type="checkbox" id="e6" class="w-5 h-5"><label for="e6">Final: ${week.card} (Elíptica)[cite: 4]</label></li>
                        </ul>
                    </div>
                    <div class="card p-5 border-l-4 border-green-500">
                        <h3 class="font-bold text-green-400 mb-3">🚶 Sábado y Domingo</h3>
                        <ul class="space-y-3">
                            <li class="flex items-center gap-3"><input type="checkbox" id="e7" class="w-5 h-5"><label for="e7">Caminar 1 hora a ritmo rápido (Sin impacto)[cite: 4]</label></li>
                        </ul>
                    </div>
                    <div class="card p-5">
                        <h3 class="font-bold text-green-400 mb-3">🥗 Alimentación Diaria</h3>
                        <p class="text-sm mb-2"><b>Desayuno:</b> Café con Leche + Tostada Centeno/Pavo[cite: 4]</p>
                        <p class="text-sm mb-2"><b>Comida:</b> Proteína magra + Brócoli/Judías + 40g Arroz[cite: 4]</p>
                        <p class="text-sm"><b>Cena:</b> Pescado/Salmón + Ensalada Mixta + 1/2 Aguacate[cite: 4]</p>
                    </div>
                </div>
            `;
            document.getElementById('content').innerHTML = html;
        }

        // Cargar semana 1 por defecto
        showWeek('S1');
    </script>
</body>
</html>
