<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Tupper Vientre Plano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: sans-serif; }
        .card { background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 1rem; overflow: hidden; }
        .week-btn.active { background: #10b981; color: white; border-color: #059669; }
        .tupper-pill { background: #f1f5f9; border-left: 4px solid #3b82f6; padding: 10px; margin-top: 8px; border-radius: 4px; }
        input[type="checkbox"] { width: 1.2rem; height: 1.2rem; accent-color: #10b981; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-3xl mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">TU PLAN DE TUPPERS (44 AÑOS)</h1>
            <p class="text-emerald-600 text-xs font-bold uppercase">Plato Único • Control Diabetes • Vientre Plano</p>
        </header>

        <!-- Selector Semanas -->
        <div class="flex gap-1 mb-6">
            <button onclick="changeWeek('S1')" id="btn-S1" class="week-btn active flex-1 py-2 rounded-lg border font-bold text-xs">SEM 1</button>
            <button onclick="changeWeek('S2')" id="btn-S2" class="week-btn flex-1 py-2 rounded-lg border font-bold text-xs">SEM 2</button>
            <button onclick="changeWeek('S3')" id="btn-S3" class="week-btn flex-1 py-2 rounded-lg border font-bold text-xs">SEM 3</button>
            <button onclick="changeWeek('S4')" id="btn-S4" class="week-btn flex-1 py-2 rounded-lg border font-bold text-xs">SEM 4</button>
        </div>

        <!-- Bloque Abdominales -->
        <div class="card p-4 border-l-4 border-emerald-500">
            <h2 class="font-black text-sm mb-3">🔥 ABDOMINALES DIARIOS (VIENTRE PLANO)</h2>
            <div class="grid grid-cols-1 gap-2 text-xs">
                <div class="flex items-center gap-2"><input type="checkbox" id="a1"><label for="a1">Plancha Frontal (4 x 45 seg)</label></div>
                <div class="flex items-center gap-2"><input type="checkbox" id="a2"><label for="a2">Plancha Lateral (3 x 30 seg por lado)</label></div>
                <div class="flex items-center gap-2"><input type="checkbox" id="a3"><label for="a3">Vacuum (5 repeticiones): Mete ombligo fuerte</label></div>
            </div>
        </div>

        <div id="content"></div>
    </div>

    <script>
        const menuS1 = [
            { d: "Lunes", tupper: "Wok de Pollo con Brócoli y 30g Arroz Integral" },
            { d: "Martes", tupper: "Lomo Magro salteado con Judías Verdes y Calabacín" },
            { d: "Miércoles", tupper: "Ensalada de Lentejas con Pavo, Pimiento y Cebolla" },
            { d: "Jueves", tupper: "Pechuga al Curry con Salteado de Verduras Variadas" },
            { d: "Viernes", tupper: "Bacalao desmigado con Garbanzos y Espinacas" }
        ];

        const menuS2 = [
            { d: "Lunes", tupper: "Pavo con Quinoa y Pimientos asados" },
            { d: "Martes", tupper: "Ensalada templada de Judiones con Atún y Tomate" },
            { d: "Miércoles", tupper: "Tiras de Pollo con Champiñones y Espárragos" },
            { d: "Jueves", tupper: "Lomo con Puré de Calabaza (bajo IG) y Brócoli" },
            { d: "Viernes", tupper: "Guiso ligero de Sepia con Guisantes y Verduras" }
        ];

        function changeWeek(w) {
            document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+w).classList.add('active');
            
            const data = (w === 'S1' || w === 'S3') ? menuS1 : menuS2;
            let html = '<h3 class="font-bold text-slate-700 mb-3 text-sm italic uppercase">Menú de Tuppers Semanal:</h3>';
            
            data.forEach(item => {
                html += `
                    <div class="card p-4">
                        <span class="text-[10px] font-black text-emerald-600 uppercase border-b pb-1">${item.d}</span>
                        <div class="tupper-pill text-xs">
                            <b>🍱 Plato Único:</b> ${item.tupper}
                        </div>
                        <p class="text-[10px] text-slate-500 mt-2">Desayuno: Café leche + Tostada centeno • Cena: Pescado/Tortilla + Ensalada</p>
                    </div>
                `;
            });
            document.getElementById('content').innerHTML = html;
        }
        changeWeek('S1');
    </script>
</body>
</html>
