<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan 4 Semanas - Definición & Salud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        .img-placeholder { width: 100%; height: 150px; object-fit: cover; background: #334155; }
        input[type="checkbox"]:checked + label { text-decoration: line-through; color: #94a3b8; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-2xl mx-auto">
        <header class="text-center py-6">
            <h1 class="text-3xl font-extrabold text-green-400">PLAN DE DEFINICIÓN</h1>
            <p class="text-slate-400 italic">44 años | 90kg | Control Glucémico</p>
        </header>

        <!-- Selector de Semanas -->
        <div class="flex justify-between mb-6 bg-slate-800 p-1 rounded-lg">
            <button onclick="openTab(event, 'Semana1')" class="tab-link flex-1 py-2 rounded-md bg-green-600 text-white">S1</button>
            <button onclick="openTab(event, 'Semana2')" class="tab-link flex-1 py-2 rounded-md">S2</button>
            <button onclick="openTab(event, 'Semana3')" class="tab-link flex-1 py-2 rounded-md">S3</button>
            <button onclick="openTab(event, 'Semana4')" class="tab-link flex-1 py-2 rounded-md">S4</button>
        </div>

        <!-- Contenido Semana 1 -->
        <div id="Semana1" class="tab-content active space-y-6">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1581009146145-b5ef03a7403f?auto=format&fit=crop&w=800&q=80" alt="Pecho" class="img-placeholder">
                <div class="p-4">
                    <h2 class="text-xl font-bold text-blue-400 mb-3">🏋️ Entrenamiento: Torso & Rodillas</h2>
                    <ul class="space-y-2">
                        <li class="flex items-center gap-3">
                            <input type="checkbox" id="s1-e1" class="w-5 h-5"><label for="s1-e1">Press Pecho + Aperturas (4x12)</label>
                        </li>
                        <li class="flex items-center gap-3">
                            <input type="checkbox" id="s1-e2" class="w-5 h-5"><label for="s1-e2">Jalón al pecho + Remo (4x10)</label>
                        </li>
                        <li class="flex items-center gap-3">
                            <input type="checkbox" id="s1-e3" class="w-5 h-5"><label for="s1-e3">Curl Bíceps Barra + Martillo (3x12)</label>
                        </li>
                        <li class="flex items-center gap-3 text-yellow-400">
                            <input type="checkbox" id="s1-e4" class="w-5 h-5"><label for="s1-e4">Extensión Rodillas (Carga Baja)</label>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=800&q=80" alt="Comida" class="img-placeholder">
                <div class="p-4">
                    <h2 class="text-xl font-bold text-green-400 mb-3">🥗 Nutrición Mercadona</h2>
                    <ul class="space-y-2">
                        <li class="flex items-center gap-3">
                            <input type="checkbox" id="s1-d1" class="w-5 h-5"><label for="s1-d1">☕ Café con Leche + Tostada Centeno[cite: 4]</label>
                        </li>
                        <li class="flex items-center gap-3">
                            <input type="checkbox" id="s1-d2" class="w-5 h-5"><label for="s1-d2">🍗 Pollo + Brócoli + 40g Arroz Integral[cite: 4]</label>
                        </li>
                        <li class="flex items-center gap-3">
                            <input type="checkbox" id="s1-d3" class="w-5 h-5"><label for="s1-d3">🐟 Merluza + Ensalada + 1/2 Aguacate[cite: 4]</label>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- (Se repiten estructuras similares para S2, S3, S4 con progresión de carga) -->
        <div id="Semana2" class="tab-content space-y-6 text-center py-20">
            <p class="text-slate-400">Progreso: Aumenta el peso en Pecho y Espalda un 5%[cite: 4].</p>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) { tabcontent[i].style.display = "none"; }
            tablinks = document.getElementsByClassName("tab-link");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" bg-green-600 text-white", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " bg-green-600 text-white";
        }
    </script>
</body>
</html>
