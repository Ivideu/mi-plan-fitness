<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Vientre Plano - 4 Semanas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: 'Segoe UI', sans-serif; }
        .card { background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); margin-bottom: 1.5rem; overflow: hidden; }
        input[type="checkbox"] { width: 1.15rem; height: 1.15rem; accent-color: #10b981; cursor: pointer; }
        input[type="checkbox"]:checked + label { text-decoration: line-through; color: #94a3b8; }
        .week-btn { transition: all 0.2s; border: 2px solid #e2e8f0; }
        .week-btn.active { background: #10b981; color: white; border-color: #059669; transform: scale(1.05); }
        .section-title { font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: #334155; border-left: 4px solid #10b981; padding-left: 10px; margin: 20px 0 10px 0; }
        .shop-item { transition: all 0.2s ease; }
        .shop-item:hover { background: #f8fafc; transform: translateX(2px); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-black text-slate-800">OBJETIVO VIENTRE PLANO</h1>
            <p class="text-emerald-600 font-bold uppercase tracking-widest text-sm">Eliminación de Grasa Frontal y Lateral</p>
        </header>

        <div class="flex gap-2 mb-8 bg-white p-2 rounded-2xl shadow-sm border border-slate-200">
            <button onclick="showWeek('S1')" id="btn-S1" class="week-btn active flex-1 py-3 rounded-xl font-black text-sm">SEMANA 1</button>
            <button onclick="showWeek('S2')" id="btn-S2" class="week-btn flex-1 py-3 rounded-xl font-black text-sm">SEMANA 2</button>
            <button onclick="showWeek('S3')" id="btn-S3" class="week-btn flex-1 py-3 rounded-xl font-black text-sm">SEMANA 3</button>
            <button onclick="showWeek('S4')" id="btn-S4" class="week-btn flex-1 py-3 rounded-xl font-black text-sm">SEMANA 4</button>
        </div>

        <div id="main-content"></div>

        <div class="card p-6 border-t-4 border-emerald-500 mt-8 mb-20">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-xl font-black text-slate-800 uppercase italic"><i class="fa-solid fa-cart-shopping text-emerald-500 mr-2"></i> Lista Mercadona Optimizada</h3>
                <span class="text-xs font-bold bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full">Click para marcar</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">
                <div>
                    <p class="font-black text-slate-700 border-b pb-2 mb-3 uppercase text-xs tracking-wider">🥩 Proteínas</p>
                    <div class="space-y-3">
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c1"><label for="c1">2 kg pechuga de pollo</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c2"><label for="c2">Pechuga de pavo 92% lonchas</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c3"><label for="c3">Carne picada de pollo</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c4"><label for="c4">Merluza congelada</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c5"><label for="c5">Sepia limpia</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c6"><label for="c6">Gambas congeladas</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c7"><label for="c7">Atún al natural (3 latas)</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c8"><label for="c8">Claras pasteurizadas</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c9"><label for="c9">Huevos (1 docena)</label></div>
                    </div>
                </div>

                <div>
                    <p class="font-black text-slate-700 border-b pb-2 mb-3 uppercase text-xs tracking-wider">🥦 Verduras</p>
                    <div class="space-y-3">
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c10"><label for="c10">Brócoli</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c11"><label for="c11">Calabacines (5-6)</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c12"><label for="c12">Espárragos verdes</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c13"><label for="c13">Pimientos</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c14"><label for="c14">Canónigos</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c15"><label for="c15">Ensalada mezclum</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c16"><label for="c16">Tomate cherry</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c17"><label for="c17">Tomates ensalada</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c18"><label for="c18">Champiñones laminados</label></div>
                    </div>
                </div>

                <div>
                    <p class="font-black text-slate-700 border-b pb-2 mb-3 uppercase text-xs tracking-wider">🥔 Carbohidratos</p>
                    <div class="space-y-3">
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c19"><label for="c19">Patatas</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c20"><label for="c20">Copos de avena</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c21"><label for="c21">Quinoa</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c22"><label for="c22">Lentejas cocidas</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c23"><label for="c23">Pan de centeno 100%</label></div>
                    </div>
                </div>

                <div>
                    <p class="font-black text-slate-700 border-b pb-2 mb-3 uppercase text-xs tracking-wider">🥑 Grasas y básicos</p>
                    <div class="space-y-3">
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c24"><label for="c24">Aguacates</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c25"><label for="c25">Nueces naturales</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c26"><label for="c26">AOVE</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c27"><label for="c27">Leche semidesnatada</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c28"><label for="c28">Queso light en lonchas</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c29"><label for="c29">Limones</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c30"><label for="c30">Cebolla + ajo</label></div>
                        <div class="shop-item flex items-center gap-3 p-2 rounded-xl"><input type="checkbox" id="c31"><label for="c31">Especias + vinagre</label></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const diet = [
            { d: "Lunes", des: "Tostada centeno + pavo", com: "Pollo, brócoli y patata cocida", cen: "Merluza y espárragos" },
            { d: "Martes", des: "Tortilla 2 huevos", com: "Pavo frío + ensalada completa", cen: "Wok pavo y calabacín" },
            { d: "Miércoles", des: "Avena y 3 nueces", com: "Lentejas con verduras", cen: "Claras y gambas" },
            { d: "Jueves", des: "Tostada y aguacate", com: "Albondigas pollo y pimientos", cen: "Ensalada atún" },
            { d: "Viernes", des: "Claras a la plancha", com: "Pollo limón y quinoa", cen: "Sepia y ensalada" },
            { d: "Sábado", des: "Tostada y queso light", com: "Pollo", cen: "Pescado al vapor" },
            { d: "Domingo", des: "Huevos revueltos", com: "Ensalada templada de pollo con calabacín y huevo cocido", cen: "Tortilla y tomate" }
        ];

        function showWeek(week) {
            document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + week).classList.add('active');

            let html = `<div class="section-title">🥗 Plan Nutricional Diario</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
            diet.forEach((day, i) => {
                html += `
                    <div class="card p-4">
                        <div class="font-black text-emerald-600 border-b mb-2 pb-1 text-xs uppercase">${day.d}</div>
                        <div class="text-xs space-y-1">
                            <p><b>☕ Desayuno:</b> Café leche + ${day.des}</p>
                            <p><b>🍲 Comida:</b> ${day.com}</p>
                            <p><b>🐟 Cena:</b> ${day.cen}</p>
                        </div>
                        <div class="mt-3 pt-2 border-t flex items-center gap-2">
                            <input type="checkbox" id="d-${i}"><label for="d-${i}" class="text-[10px] font-bold text-slate-400">DÍA COMPLETADO</label>
                        </div>
                    </div>`;
            });
            html += `</div>`;
            document.getElementById('main-content').innerHTML = html;
        }
        showWeek('S1');
    </script>
</body>
</html>
