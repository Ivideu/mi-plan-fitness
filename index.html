<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Transformación - Modo Claro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 1.5rem; }
        input[type="checkbox"] { width: 1.1rem; height: 1.1rem; accent-color: #10b981; }
        input[type="checkbox"]:checked + label { text-decoration: line-through; color: #94a3b8; }
        .week-btn { border: 2px solid #e2e8f0; transition: all 0.3s; }
        .week-btn.active { background: #10b981; color: white; border-color: #059669; }
        .diet-header { background: #f1f5f9; border-bottom: 2px solid #10b981; padding: 8px 12px; font-weight: 800; border-radius: 8px 8px 0 0; }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-3xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-black text-slate-800 uppercase tracking-tight">Mi Plan 4 Semanas</h1>
            <p class="text-emerald-600 font-bold uppercase text-sm tracking-widest mt-1">Definición • Fuerza • Salud</p>
        </header>

        <!-- Navegación de Semanas -->
        <div class="flex gap-2 mb-8 sticky top-2 z-10 bg-white/80 backdrop-blur p-2 rounded-xl shadow-sm border border-slate-100">
            <button onclick="showWeek('S1')" id="btn-S1" class="week-btn active flex-1 py-2 rounded-lg font-bold text-xs">SEM 1</button>
            <button onclick="showWeek('S2')" id="btn-S2" class="week-btn flex-1 py-2 rounded-lg font-bold text-xs">SEM 2</button>
            <button onclick="showWeek('S3')" id="btn-S3" class="week-btn flex-1 py-2 rounded-lg font-bold text-xs">SEM 3</button>
            <button onclick="showWeek('S4')" id="btn-S4" class="week-btn flex-1 py-2 rounded-lg font-bold text-xs">SEM 4</button>
        </div>

        <div id="content" class="space-y-4"></div>

        <!-- COMPRA MERCADONA ACTUALIZADA -->
        <div class="card p-6 border-t-4 border-emerald-500 mt-10 mb-20">
            <h3 class="text-lg font-black text-slate-800 mb-4 uppercase"><i class="fa-solid fa-basket-shopping text-emerald-500 mr-2"></i> Compra Mercadona</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-y-2 text-sm">
                <div class="flex items-center gap-2"><input type="checkbox" id="c1"><label for="c1">Leche +Proteínas (Brick Azul)</label></div>
                <div class="flex items-center gap-2"><input type="checkbox" id="c2"><label for="c2">Pan Centeno 100% integral</label></div>
                <div class="flex items-center gap-2"><input type="checkbox" id="c3"><label for="c3">Pollo, Pavo y Ternera magra</label></div>
                <div class="flex items-center gap-2"><input type="checkbox" id="c4"><label for="c4">Salmón, Merluza y Sepia</label></div>
                <div class="flex items-center gap-2"><input type="checkbox" id="c5"><label for="c5">Arroz integral y Quinoa</label></div>
                <div class="flex items-center gap-2"><input type="checkbox" id="c6"><label for="c6">Frutos Rojos y Gelatina 0%</label></div>
            </div>
        </div>
    </div>

    <script>
        const diet = [
            { d: "Lunes", des: "Tostada centeno/pavo", com: "Pollo, brócoli, 40g arroz", cen: "Merluza con espárragos" },
            { d: "Martes", des: "Tortilla 2 huevos", com: "Salmón con canónigos", cen: "Wok pavo y calabacín" },
            { d: "Miércoles", des: "Avena y 3 nueces", com: "Lentejas con verduras", cen: "Revuelto claras y gambas" },
            { d: "Jueves", des: "Tostada y aguacate", com: "Ternera con pimientos", cen: "Ensalada atún natural" },
            { d: "Viernes", des: "Claras a la plancha", com: "Pollo limón y quinoa", cen: "Sepia con ensalada" },
            { d: "Sábado", des: "Tostada y queso light", com: "Paella verduras/pollo", cen: "Pescado al vapor" },
            { d: "Domingo", des: "Huevos revueltos", com: "Garbanzos y espinacas", cen: "Tortilla y tomate" }
        ];

        function showWeek(week) {
            document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + week).classList.add('active');

            let html = `
                <!-- ENTRENAMIENTO -->
                <div class="card border-l-4 border-blue-500">
                    <div class="p-4 bg-blue-50/50">
                        <h2 class="font-black text-blue-700 uppercase text-sm italic">L - M - V: Torso Superior</h2>
                    </div>
                    <div class="p-4 space-y-3">
                        <div class="flex items-center gap-3"><input type="checkbox" id="tr1"><label for="tr1" class="text-sm">Pecho: Press (4x10) + Aperturas (3x12)</label></div>
                        <div class="flex items-center gap-3"><input type="checkbox" id="tr2"><label for="tr2" class="text-sm">Espalda: Jalón (4x10) + Remo (3x12)</label></div>
                        <div class="flex items-center gap-3"><input type="checkbox" id="tr3"><label for="tr3" class="text-sm">Bíceps: Curl Barra (3x12) + Martillo (3x12)[cite: 5]</label></div>
                        <div class="flex items-center gap-3 text-emerald-600 font-bold"><input type="checkbox" id="tr4"><label for="tr4" class="text-sm">HIIT: 15 min Elíptica (1' fuerte / 1' suave)[cite: 5]</label></div>
                    </div>
                </div>

                <div class="card border-l-4 border-orange-500">
                    <div class="p-4 bg-orange-50/50">
                        <h2 class="font-black text-orange-700 uppercase text-sm italic">M - J: Fuerza y Core[cite: 5]</h2>
                    </div>
                    <div class="p-4 space-y-3">
                        <div class="flex items-center gap-3"><input type="checkbox" id="mj1"><label for="mj1" class="text-sm">Prensa de Piernas (Fuerza - 4 series)[cite: 5]</label></div>
                        <div class="flex items-center gap-3"><input type="checkbox" id="mj2"><label for="mj2" class="text-sm">Planchas Abdominales (4 series)[cite: 5]</label></div>
                        <div class="flex items-center gap-3"><input type="checkbox" id="mj3"><label for="mj3" class="text-sm italic">40 min Bici/Cinta (Ritmo constante)[cite: 5]</label></div>
                    </div>
                </div>

                <h3 class="font-black text-slate-800 text-center py-4 uppercase tracking-widest text-lg">--- Menú Diario ---</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            `;

            diet.forEach((day, i) => {
                html += `
                    <div class="card">
                        <div class="diet-header text-emerald-700 text-xs">${day.d.toUpperCase()}</div>
                        <div class="p-4 space-y-2 text-sm">
                            <p>☕ <b>7:15:</b> Café leche + ${day.des}[cite: 5]</p>
                            <p>🍲 <b>14:00:</b> ${day.com}[cite: 5]</p>
                            <p>🐟 <b>21:00:</b> ${day.cen}[cite: 5]</p>
                        </div>
                    </div>
                `;
            });

            html += `</div>
                <div class="card bg-slate-50 p-4 border-dashed border-2 border-slate-200 text-center">
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-tighter">Sábado y Domingo: Caminar 1 hora[cite: 5]</p>
                </div>`;
            document.getElementById('content').innerHTML = html;
        }
        showWeek('S1');
    </script>
</body>
</html>
